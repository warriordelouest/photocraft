[package]
name = "photocraft-assistant"
description = "AI design assistant: model gateways (Anthropic and OpenAI-compatible), agent loop and tool definitions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "http2", "charset"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
